name: Build plugin

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images to registry and update version repo"
        type: boolean
        default: true
  pull_request:
    branches: ["mc"]
  release:
    types: ["published"]
  push:
    branches: ["mc"]
    paths:
      - Dockerfile
      - "rootfs/**"

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  BUILD_NAME: multicast
  BUILD_TYPE: plugin
  IMAGE_NAME: mcos-multicast

permissions:
  contents: write

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: muthur-command/actions/helpers/version@mc
        with:
          type: ${{ env.BUILD_TYPE }}

      - name: Get build matrix
        id: matrix
        uses: muthur-command/builder/actions/prepare-multi-arch-matrix@2026.06.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        id: build
        uses: muthur-command/builder/actions/build-image@2026.06.2
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign-base-identity: 'https://github.com/muthur-command/docker-base/.*'
          cosign-base-verify: ghcr.io/muthur-command/base:3.23-2026.06.2
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ needs.init.outputs.publish == 'true' }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: needs.init.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: muthur-command/builder/actions/publish-multi-arch-manifest@2026.06.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

  version:
    name: Update version
    if: github.repository_owner == 'muthur-command'
    needs: [init, build, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        if: needs.init.outputs.publish == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git
        if: needs.init.outputs.publish == 'true'
        uses: muthur-command/actions/helpers/git-init@mc
        with:
          name: ${{ secrets.GIT_NAME }}
          email: ${{ secrets.GIT_EMAIL }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update version file
        if: needs.init.outputs.publish == 'true'
        uses: muthur-command/actions/helpers/version-push@mc
        with:
          key: ${{ env.BUILD_NAME }}
          version: ${{ needs.init.outputs.version }}
          channel: ${{ needs.init.outputs.channel }}
